name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint (syntax only, no formatter dep)
        run: python -m compileall -q packages apps
      - name: Unit + grounding tests
        env:
          LLM_PROVIDER: none
        run: pytest -q
      - name: Docker build sanity
        run: docker build -t seomjari:ci .
