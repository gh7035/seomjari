[project]
name = "seomjari"
version = "0.1.0"
description = "섬자리: 성수기 착시를 걷어내는 제주 창업 입지 Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["agent*", "pipeline*"]

[tool.setuptools.package-data]
pipeline = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
