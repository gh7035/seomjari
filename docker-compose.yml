# 80/443 은 호스트 nginx 가 받는다. 앱은 호스트 루프백으로만 연다.
# 메모리 값은 deploy/remote-up.sh 가 호스트 RAM 기준으로 deploy/mem.env 에 쓴다.

name: seomjari

services:
  blue: &app
    image: seomjari:app
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seomjari-blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data/processed
      SESSION_DB: /var/sessions/sessions.sqlite3
      LOG_JSON: "true"
    volumes:
      - sessions:/var/sessions
    mem_limit: ${APP_MEM_LIMIT:-384m}
    memswap_limit: ${APP_MEM_LIMIT:-384m}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  green:
    <<: *app
    container_name: seomjari-green
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  sessions:
